 menus:{title:'Menus & Navigation',singular:'Menu item',desc:'Manage header and footer navigation links.',icon:'☷',cols:[['label','Menu label'],['url','Link URL'],['location','Menu location'],['sortOrder','Order'],['status','Status']],fields:[['label','Menu label','text',1],['url','Link URL','text',1],['location','Menu location','select',['Header','Footer']],['sortOrder','Display order','number'],['status','Status','select',['Draft','In Review','Published','Archived']]]},
 users:{title:'Users & Roles',singular:'User',desc:'Manage CMS access and assign content-management roles.',icon:'♧',cols:[['name','Name'],['email','Email'],['role','Role'],['status','Status']],fields:[['name','Full name','text',1],['email','Email address','email',1],['role','Role','select',['Super Admin','Admin','Editor','Reviewer']],['status','Account status','select',['Active','Inactive']]]}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusTag(s){const cls=String(s||'draft').toLowerCase().replace(/\s+/g,'-');return `<span class="status ${esc(cls)}">${esc(s||'Draft')}</span>`}
function head(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function button(label,action,primary=false,extra=''){return `<button class="btn ${primary?'btn-primary':''} ${extra}" data-action="${action}">${label}</button>`}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));document.getElementById('crumb').textContent=currentView==='dashboard'?'Dashboard':(configs[currentView]?.title||({media:'Media Library',inquiries:'Contact Inquiries',seo:'SEO Management',settings:'Website Settings'}[currentView]));document.getElementById('globalSearch').value=currentSearch;let html='';if(currentView==='dashboard')html=dashboard();else if(configs[currentView])html=collectionView(currentView);else if(currentView==='media')html=mediaView();else if(currentView==='inquiries')html=inquiriesView();else if(currentView==='seo')html=seoView();else if(currentView==='settings')html=settingsView();document.getElementById('view').innerHTML=html;bindViewActions()}
function dashboard(){const totalPages=data.pages.length, published=data.pages.filter(x=>x.status==='Published').length, drafts=Object.values(data).flat().filter(x=>x&&x.status==='Draft').length, inquiries=data.inquiries.filter(x=>['New','Pending'].includes(x.status)).length;const recent=[...data.pages,...data.programs,...data.news].sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,5);return `${head('OVERVIEW','Dashboard','Here is what is happening across your website content.',button('↗ Preview website','preview')+button('＋ Create page','new:pages',true))}
<div class="grid stats"><div class="card stat-card"><div class="stat-top">Total website pages <span class="stat-icon">▤</span></div><div class="stat-num">${totalPages}</div><div class="stat-foot"><span>${published} published</span> · ${totalPages-published} unpublished</div></div><div class="card stat-card"><div class="stat-top">Draft content <span class="stat-icon">◷</span></div><div class="stat-num">${drafts}</div><div class="stat-foot">Across all content modules</div></div><div class="card stat-card"><div class="stat-top">Programs & services <span class="stat-icon">▣</span></div><div class="stat-num">${data.programs.length}</div><div class="stat-foot">${data.programs.filter(x=>x.status==='Published').length} currently published</div></div><div class="card stat-card"><div class="stat-top">Open inquiries <span class="stat-icon">✉</span></div><div class="stat-num">${inquiries}</div><div class="stat-foot">New or awaiting response</div></div></div>
<div class="grid dashboard-grid"><div class="card"><div class="panel-head"><div><h3>Recently updated content</h3><p>Latest changes across your website</p></div>${button('View pages','go:pages')}</div><div class="table-wrap"><table><thead><tr><th>Content</th><th>Module</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>${recent.map(x=>`<tr><td><div class="item-title">${esc(x.title||x.name||x.sectionName)}</div><div class="subtext">${esc(x.slug||x.excerpt||x.heading||'')}</div></td><td>${data.pages.includes(x)?'Pages':data.programs.includes(x)?'Programs':'News & Events'}</td><td>${statusTag(x.status)}</td><td>${esc(x.updated||x.publishDate||'—')}</td><td><button class="icon-btn" data-action="go:pages">→</button></td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><div class="panel-head"><div><h3>Quick actions</h3><p>Common content tasks</p></div></div><div class="quick-list"><div class="quick-item"><div class="quick-symbol">▤</div><div><b>Create a new page</b><small>Add a new website page</small></div>${button('Create','new:pages')}</div><div class="quick-item"><div class="quick-symbol">▣</div><div><b>Add a program</b><small>Update programs and services</small></div>${button('Add','new:programs')}</div><div class="quick-item"><div class="quick-symbol">▧</div><div><b>Publish an update</b><small>Post news or an event</small></div>${button('Create','new:news')}</div><div class="quick-item"><div class="quick-symbol">✉</div><div><b>Review inquiries</b><small>Respond to website visitors</small></div>${button('Review','go:inquiries')}</div></div></div>
<div class="card"><div class="panel-head"><div><h3>Content distribution</h3><p>Current page publication status</p></div></div><div style="padding:20px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px"><b>Published pages</b><span class="muted">${published} / ${totalPages}</span></div><div style="height:9px;background:#eef1f6;border-radius:10px;overflow:hidden"><div style="height:100%;width:${totalPages?published/totalPages*100:0}%;background:linear-gradient(90deg,#2857d5,#28b7c5);border-radius:10px"></div></div><div style="display:flex;justify-content:space-between;margin-top:17px;font-size:10px;color:var(--muted)"><span>Draft and review content</span><b>${drafts}</b></div></div></div>
<div class="card"><div class="panel-head"><div><h3>Content workflow</h3><p>Suggested publishing process</p></div></div><div class="activity"><div class="activity-row"><span class="dot"></span><div><b>Draft</b><small>Editor creates or updates content.</small></div></div><div class="activity-row"><span class="dot" style="background:#e2a33c"></span><div><b>Review</b><small>Reviewer checks accuracy and presentation.</small></div></div><div class="activity-row"><span class="dot" style="background:#15936a"></span><div><b>Publish</b><small>Authorized user makes content public.</small></div></div></div></div></div>`}
function collectionView(key){const cfg=configs[key];let rows=data[key]||[];const q=currentSearch.toLowerCase();if(q)rows=rows.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q)));const filters=`<div class="toolbar"><div class="filters"><select id="statusFilter"><option value="">All statuses</option><option>Draft</option><option>In Review</option><option>Published</option><option>Archived</option><option>Active</option><option>Inactive</option></select><span class="muted" style="font-size:11px">${rows.length} record(s)</span></div><div class="filters"><button class="btn" data-action="export">↓ Export data</button></div></div>`;return `${head('CONTENT MANAGEMENT',cfg.title,cfg.desc,button('＋ Add '+cfg.singular,'new:'+key,true))}<div class="card">${filters}<div class="table-wrap"><table><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="dataRows">${rows.length?rows.map(row=>`<tr data-status="${esc(row.status)}">${cfg.cols.map(c=>`<td>${c[0]==='status'?statusTag(row[c[0]]):c[0]==='title'||c[0]==='name'||c[0]==='sectionName'||c[0]==='label'||c[0]==='person'?`<div class="item-title">${esc(row[c[0]])}</div>`:c[0]==='quote'?`<div style="max-width:280px;white-space:normal">${esc(row[c[0]])}</div>`:`<span>${esc(row[c[0]]||'—')}</span>`}</td>`).join('')}<td><button class="icon-btn" title="Edit" data-action="edit:${key}:${row.id}">✎</button><button class="icon-btn" title="Delete" data-action="delete:${key}:${row.id}">⌫</button></td></tr>`).join(''):`<tr><td colspan="${cfg.cols.length+1}"><div class="empty"><b>No records found</b>Try changing your search or add new content.</div></td></tr>`}</tbody></table></div><div class="table-footer">Showing ${rows.length} ${cfg.title.toLowerCase()} record(s). Changes are saved in this browser.</div></div>${key==='users'?`<div class="notice"><b>Role guidance:</b> Super Admin — full system access. Admin — manage content and settings. Editor — create and edit content. Reviewer — review content and update review status. These are prototype role labels; actual permission enforcement requires a secure backend.</div>`:''}`}
function mediaView(){const list=data.media.filter(x=>!currentSearch||[x.name,x.altText,x.fileType].join(' ').toLowerCase().includes(currentSearch.toLowerCase()));return `${head('ASSETS','Media Library','Organize image assets and their alternative text for accessible website content.',button('＋ Add media','new:media',true))}<div class="card"><div class="toolbar"><div class="filters"><span class="muted" style="font-size:11px">${list.length} media item(s)</span><span class="muted" style="font-size:10px">· Store asset metadata in this prototype</span></div>${button('↑ Upload file','upload')}</div><div class="media-grid">${list.map(x=>`<div class="media-card"><div class="media-thumb">${x.fileType==='Document'?'▤':'▧'}</div><div class="media-meta"><b>${esc(x.name)}</b><small>${esc(x.fileType)} · ${esc(x.fileSize||'—')}</small><div style="display:flex;justify-content:space-between;margin-top:7px"><button class="icon-btn" data-action="edit:media:${x.id}">✎ Edit</button><button class="icon-btn" data-action="delete:media:${x.id}">⌫</button></div></div></div>`).join('')}</div></div><div class="notice"><b>Prototype note:</b> This library stores file details in your browser. Production media uploads should be connected to secure cloud/object storage, with file validation and access control.</div>`}
function inquiriesView(){let rows=data.inquiries.filter(x=>!currentSearch||[x.name,x.email,x.subject,x.message].join(' ').toLowerCase().includes(currentSearch.toLowerCase()));return `${head('ENGAGEMENT','Contact Inquiries','Review messages submitted through the public website contact form.') }<div class="card"><div class="toolbar"><div class="filters"><select id="inquiryFilter"><option value="">All inquiries</option><option>New</option><option>Pending</option><option>Answered</option></select><span class="muted" style="font-size:11px">${rows.length} inquiry(s)</span></div></div><div class="table-wrap"><table><thead><tr><th>Sender</th><th>Subject</th><th>Received</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="item-title">${esc(x.name)}</div><div class="subtext">${esc(x.email)}</div></td><td>${esc(x.subject)}</td><td>${esc(x.received)}</td><td>${statusTag(x.status)}</td><td><button class="btn btn-soft" data-action="readInquiry:${x.id}">View message</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty"><b>No inquiries found</b></div></td></tr>`}</tbody></table></div><div class="table-footer">Inquiry records are sample data until a live contact form is connected.</div></div>`}
function seoView(){return `${head('DISCOVERABILITY','SEO Management','Set default search metadata and review page-level SEO information.',button('Save SEO settings','saveSeo',true))}<div class="grid settings-grid"><div class="card"><div class="panel-head"><div><h3>Default SEO settings</h3><p>Fallback metadata for the website</p></div></div><div class="settings-form"><div class="field"><label>Website title</label><input id="seoSiteTitle" value="${esc(data.settings?.seoSiteTitle||'SEEK International')}" /></div><div class="field"><label>Default meta description</label><textarea id="seoDescription">${esc(data.settings?.seoDescription||'Discover SEEK International, our programs, services, and latest updates.')}</textarea></div><div class="field"><label>Default keywords</label><input id="seoKeywords" value="${esc(data.settings?.seoKeywords||'SEEK International, programs, services')}" /></div><div class="field"><label>Social sharing image URL</label><input id="seoImage" value="${esc(data.settings?.seoImage||'')}" placeholder="https://..." /></div></div></div><div class="card"><div class="panel-head"><div><h3>Page SEO checklist</h3><p>Pages with missing title or description</p></div></div><div class="quick-list">${data.pages.map(p=>{let missing=!p.seoTitle||!p.seoDescription;return `<div class="quick-item"><div class="quick-symbol">${missing?'!':'✓'}</div><div><b>${esc(p.title)}</b><small>${missing?'SEO information needs attention':'Title and description configured'}</small></div><span class="status ${missing?'pending':'published'}">${missing?'Needs review':'Ready'}</span><button class="icon-btn" data-action="edit:pages:${p.id}">✎</button></div>`}).join('')}</div></div></div><div class="notice"><b>SEO recommendation:</b> Use a unique title and concise description for each indexable page. Ensure page URLs are readable and images have meaningful alternative text.</div>`}
function settingsView(){const s=data.settings||{};return `${head('CONFIGURATION','Website Settings','Manage the core information displayed across your public website.',button('Save settings','saveSettings',true))}<div class="grid settings-grid"><div class="card"><div class="panel-head"><div><h3>Organization information</h3><p>Public identity and contact details</p></div></div><div class="settings-form"><div class="field"><label>Website / organization name</label><input id="siteName" value="${esc(s.siteName||'SEEK International')}" /></div><div class="field"><label>Tagline</label><input id="tagline" value="${esc(s.tagline||'Know More. Do More.')}" /></div><div class="field"><label>Contact email</label><input id="contactEmail" type="email" value="${esc(s.contactEmail||'info@example.com')}" /></div><div class="field"><label>Phone number</label><input id="phone" value="${esc(s.phone||'')}" /></div><div class="field"><label>Office address</label><textarea id="address">${esc(s.address||'')}</textarea></div></div></div><div class="card"><div class="panel-head"><div><h3>Website configuration</h3><p>General publishing and social information</p></div></div><div class="settings-form"><div class="field"><label>Public website URL</label><input id="websiteUrl" value="${esc(s.websiteUrl||'https://example.com')}" /></div><div class="field"><label>Facebook URL</label><input id="facebook" value="${esc(s.facebook||'')}" /></div><div class="field"><label>LinkedIn URL</label><input id="linkedin" value="${esc(s.linkedin||'')}" /></div><div class="field"><label>Instagram URL</label><input id="instagram" value="${esc(s.instagram||'')}" /></div><div class="field"><label>Footer copyright text</label><input id="copyright" value="${esc(s.copyright||'© SEEK International. All rights reserved.')}" /></div><div class="notice">For this prototype, settings are stored in browser storage. Production settings should be securely stored in the CMS database.</div></div></div></div><div class="card" style="margin-top:17px"><div class="panel-head"><div><h3>Data & backup</h3><p>Export the current content or restore it from a JSON backup.</p></div></div><div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">${button('↓ Export CMS data','export')}${button('↑ Import JSON backup','import')}${button('↻ Reset sample data','reset',false,'btn-danger')}</div></div>`}
function bindViewActions(){const sf=document.getElementById('statusFilter');if(sf)sf.onchange=()=>{document.querySelectorAll('#dataRows tr[data-status]').forEach(r=>r.style.display=!sf.value||r.dataset.status===sf.value?'':'none')};const inf=document.getElementById('inquiryFilter');if(inf)inf.onchange=()=>document.querySelectorAll('#view tbody tr').forEach(r=>{const st=r.querySelector('.status')?.textContent;r.style.display=!inf.value||st===inf.value?'':'none'});}
function openModal(title,body,foot,wide=false){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modal').classList.toggle('wide',wide);document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function formField(field,value=''){const [name,label,type,opts]=field;let required=opts===1;let html='';if(type==='textarea')html=`<textarea id="f_${name}" ${required?'required':''}>${esc(value)}</textarea>`;else if(type==='select')html=`<select id="f_${name}">${(opts||[]).map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else html=`<input id="f_${name}" type="${type}" value="${esc(value)}" ${required?'required':''} />`;return `<div class="field ${type==='textarea'?'span-2':''}"><label>${label}${required?' *':''}</label>${html}</div>`}
function editRecord(key,id=null){const cfg=configs[key];const record=id?data[key].find(x=>x.id===id):{};editingId=id;modalCollection=key;const fields=cfg.fields.map(f=>formField(f,record?.[f[0]]??(f[0]==='status'?'Draft':f[0]==='publishDate'?today:''))).join('');openModal((id?'Edit ':'Create ')+cfg.singular,`<form id="recordForm"><div class="form-grid">${fields}</div></form>`,`<button class="btn" data-action="closeModal">Cancel</button><div class="modal-foot-right"><button class="btn btn-primary" data-action="saveRecord">Save ${cfg.singular}</button></div>`)}
function editSpecial(key,id=null){if(key==='media'){const r=id?data.media.find(x=>x.id===id):{};editingId=id;modalCollection='media';const f=[['name','Asset name','text',1],['fileType','File type','select',['Image','Document','Video','Other']],['altText','Alternative text','text'],['url','Asset URL','url'],['fileSize','File size / note','text']];openModal((id?'Edit ':'Add ')+'Media item',`<form id="recordForm"><div class="form-grid">${f.map(x=>formField(x,r?.[x[0]]||'')).join('')}</div></form>`,`<button class="btn" data-action="closeModal">Cancel</button><div class="modal-foot-right"><button class="btn btn-primary" data-action="saveRecord">Save media</button></div>`)}else if(key==='inquiries'){}}
function saveRecord(){const key=modalCollection;const cfg=configs[key];const form=document.getElementById('recordForm');if(!form.reportValidity())return;const obj={};(cfg?cfg.fields:[['name'],['fileType'],['altText'],['url'],['fileSize']]).forEach(f=>{const el=document.getElementById('f_'+f[0]);obj[f[0]]=el?el.value.trim():''});obj.updated=today;if(key==='media'&&!obj.fileSize)obj.fileSize='—';if(editingId){const i=data[key].findIndex(x=>x.id===editingId);data[key][i]={...data[key][i],...obj}}else{obj.id=Math.max(0,...data[key].map(x=>x.id||0))+1;data[key].unshift(obj)}saveData();closeModal();toast((cfg?.singular||'Media item')+' saved successfully');render()}
function deleteRecord(key,id){if(!confirm('Delete this record? This action cannot be undone.'))return;data[key]=data[key].filter(x=>x.id!==id);saveData();toast('Record deleted');render()}
function viewInquiry(id){const r=data.inquiries.find(x=>x.id===id);if(!r)return;openModal('Contact inquiry',`<div class="form-grid"><div class="field"><label>Sender</label><div>${esc(r.name)}</div></div><div class="field"><label>Email</label><div>${esc(r.email)}</div></div><div class="field"><label>Subject</label><div>${esc(r.subject)}</div></div><div class="field"><label>Received</label><div>${esc(r.received)}</div></div><div class="field span-2"><label>Message</label><div style="background:#f7f8fb;border-radius:8px;padding:14px;white-space:pre-wrap">${esc(r.message)}</div></div><div class="field"><label>Inquiry status</label><select id="inquiryStatus">${['New','Pending','Answered'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`,`<button class="btn" data-action="closeModal">Close</button><div class="modal-foot-right"><button class="btn btn-primary" data-action="saveInquiry:${id}">Save status</button></div>`)}
function preview(){const p=data.pages.find(x=>x.slug==='/')||data.pages[0]||{title:'Welcome',content:'Your website content will appear here.'};const nav=data.menus.filter(x=>x.location==='Header'&&x.status==='Published').sort((a,b)=>a.sortOrder-b.sortOrder);openModal('Website preview',`<div class="preview-shell"><div class="preview-nav"><div class="preview-logo">SEEK.</div><div class="preview-links">${nav.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div></div><div class="preview-hero"><div class="tag">SEEK INTERNATIONAL</div><h1>${esc(data.homeSections.find(x=>x.sectionName==='Hero Banner')?.heading||'Know More. Do More.')}</h1><p>${esc(data.homeSections.find(x=>x.sectionName==='Hero Banner')?.description||p.content)}</p><button class="btn" style="background:#fff;color:#1b3970;border:0;margin-top:8px">Discover more →</button></div><div class="preview-body"><div><h2>${esc(data.homeSections.find(x=>x.sectionName==='Introduction')?.heading||'Welcome to SEEK International')}</h2><p>${esc(data.homeSections.find(x=>x.sectionName==='Introduction')?.description||p.content)}</p></div><div class="preview-block"><b>Explore our programs</b><p>${data.programs.filter(x=>x.status==='Published').length} published program(s) are currently available in this prototype.</p></div></div></div><div class="notice"><b>Preview mode:</b> This is a simplified preview generated from the sample CMS content, not a live rendering of the Figma website.</div>`,`<button class="btn" data-action="closeModal">Close preview</button>`,true)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='seek-cms-backup-'+today+'.json';a.click();URL.revokeObjectURL(a.href);toast('CMS data exported')}
function importData(){document.getElementById('importFile').click()}
function saveSettings(){const ids=['siteName','tagline','contactEmail','phone','address','websiteUrl','facebook','linkedin','instagram','copyright'];data.settings=data.settings||{};ids.forEach(id=>data.settings[id]=document.getElementById(id).value.trim());saveData();toast('Website settings saved')}
function saveSeo(){const ids=['seoSiteTitle','seoDescription','seoKeywords','seoImage'];data.settings=data.settings||{};ids.forEach(id=>data.settings[id]=document.getElementById(id).value.trim());saveData();toast('SEO settings saved')}
function resetData(){if(!confirm('Reset all CMS content to the original sample data? Your current browser data will be replaced.'))return;data=structuredClone(seed);saveData();currentSearch='';toast('Sample data restored');render()}
function handleAction(action){if(action==='preview'){preview();return}if(action==='closeModal'){closeModal();return}if(action.startsWith('new:')){let k=action.split(':')[1];if(k==='media')editSpecial(k);else if(configs[k])editRecord(k);return}if(action.startsWith('edit:')){let [,k,id]=action.split(':');if(k==='media')editSpecial(k,Number(id));else editRecord(k,Number(id));return}if(action.startsWith('delete:')){let [,k,id]=action.split(':');deleteRecord(k,Number(id));return}if(action.startsWith('go:')){navigate(action.split(':')[1]);return}if(action.startsWith('readInquiry:')){viewInquiry(Number(action.split(':')[1]));return}if(action.startsWith('saveInquiry:')){const id=Number(action.split(':')[1]);const r=data.inquiries.find(x=>x.id===id);r.status=document.getElementById('inquiryStatus').value;saveData();closeModal();toast('Inquiry status updated');render();return}if(action==='saveRecord'){saveRecord();return}if(action==='saveSettings'){saveSettings();return}if(action==='saveSeo'){saveSeo();return}if(action==='export'){exportData();return}if(action==='import'){importData();return}if(action==='reset'){resetData();return}if(action==='upload'){editSpecial('media');return}}
function navigate(v){currentView=v;currentSearch='';document.getElementById('sidebar').classList.remove('open');render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action)}});
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
document.getElementById('globalSearch').addEventListener('input',e=>{currentSearch=e.target.value;render()});
document.getElementById('topNewBtn').addEventListener('click',()=>{if(configs[currentView])editRecord(currentView);else editRecord('pages')});
document.getElementById('viewSiteBtn').addEventListener('click',preview);
document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.pages))throw new Error('Invalid backup');data={...structuredClone(seed),...parsed};saveData();toast('CMS data imported');render()}catch(err){alert('Could not import this file. Please select a valid SEEK CMS JSON backup.')}e.target.value=''});
updateCounts();render();
</script>
</body>
